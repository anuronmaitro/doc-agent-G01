[project]
name = "doc-agent"
version = "0.1.0"
# Upper bound is REQUIRED, not cosmetic: the pinned torch<2.4 and faiss-cpu<1.9
# only publish cp311/cp312 wheels, so 3.13+ cannot install this lock at all.
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.2,<2.4",
  "lightning>=2.2,<2.4",
  "transformers>=4.40,<4.45",
  "timm>=1.0,<1.1",
  "datasets>=2.19,<3.0",
  "torchmetrics>=1.3,<1.5",
  "sentence-transformers>=2.7,<3.0",
  "faiss-cpu>=1.8,<1.9",
  # faiss-cpu 1.8.x ships a prebuilt extension compiled against NumPy 1.x's C-ABI
  # and declares no upper bound on numpy itself, so an unpinned resolver can pick
  # numpy>=2.0 and the extension fails at import with "compiled using NumPy 1.x
  # cannot be run in NumPy 2.x" -- found on Step 30's Kaggle run, where `uv pip
  # compile pyproject.toml -o requirements.lock` (compiling only the core deps,
  # without the numba/ydata-profiling dev extras whose own numpy caps otherwise
  # keep this in check) resolved numpy==2.5.1 and crashed store.build() after a
  # ~4.4h OCR run completed successfully.
  "numpy>=1.24,<2.0",
  "gymnasium>=0.29,<1.0",
  "fastapi>=0.111,<0.116",
  "gradio>=4.31,<5.0",
  "wandb>=0.17,<0.18",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "pydantic-settings>=2.2,<3.0",
  # --- MathScholar additions (A2): LoRA fine-tuning of the OCR reader,
  #     classical image preprocessing/degradation, and page rendering.
  #     We avoid the nougat-ocr package (its pins on transformers/timm would
  #     break this lock); transformers ships the Nougat architecture natively.
  "peft>=0.11,<0.13",
  "opencv-python-headless>=4.9",
  "pymupdf>=1.24",
  # --- Nougat post-processing backends (added in Step 16). ---------------------
  #     CORRECTION to the note above, which used to claim Nougat "needs no extra
  #     package". The *architecture* needs none, but NougatProcessor.
  #     post_process_generation() -- which vision/ocr.py calls on every page --
  #     opens with requires_backends(self, ["nltk", "levenshtein"]) and raises
  #     ImportError without them. transformers declares them nowhere, so a clean
  #     install of this repo could not run its own OCR stage on any machine.
  #     Found when Step 16's Kaggle smoke run died here; reproduced locally
  #     (is_levenshtein_available() and is_nltk_available() were both False).
  #     The smoke phase existing is the only reason this cost 22 minutes of GPU
  #     rather than surfacing three hours into the full-book run.
  "python-Levenshtein>=0.25,<1.0",
  "nltk>=3.8,<4.0",
  # --- Step 27: `import lightning` needs pkg_resources at import time -----------
  #     (lightning/fabric/__init__.py calls __import__("pkg_resources").declare_
  #     namespace(...)), but setuptools>=81 stopped shipping pkg_resources by
  #     default. Without this pin, `python scripts/smoke_train.py` (or anything
  #     importing doc_agent.training.*) dies on the very first import with
  #     "ModuleNotFoundError: No module named 'pkg_resources'" before reaching any
  #     of this project's own code -- found running Step 27's smoke train, not
  #     assumed. lightning's own dependency metadata doesn't pin this itself.
  "setuptools<81",
  # --- A3 Step 2: LLM client. D1 (plan_a3.md §5) picked Groq's free tier -- no per-call
  # cost, no GPU competition with the OCR/eval jobs, works from anywhere including Kaggle.
  # `groq` is a real, separate PyPI package (Stainless-generated, same shape as `openai`'s
  # SDK) -- not something reachable through anything already pinned above.
  "groq>=0.9,<1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "black>=24.4", "mypy>=1.10", "pytest>=8.2", "pre-commit>=3.7"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Frozen Kaggle output exhibits: exact, unedited copies of what was actually run and
# what it actually printed (real execution outputs embedded, downloaded straight from
# Kaggle). Rewriting their source to satisfy UP031/E402/I001 without re-running on a GPU
# would desync the code from the outputs it claims to have produced -- the one thing a
# grounding exhibit can't do. Each has a maintained, lint-clean `kaggle_*.ipynb` sibling
# (or, for step16_baseline_ocr, its sibling in step18b_ocr_repair/ -- same underlying
# kernel, edited in place across both runs) that IS linted; these are reference-only.
extend-exclude = [
    "KAGGLE/step16_baseline_ocr/mathscholar-step16-baseline-ocr.ipynb",
    "KAGGLE/step18b_ocr_repair/mathscholar-step18b-ocr-repair.ipynb",
    "KAGGLE/step28_finetune/mathscholar-step28-finetune.ipynb",
    "KAGGLE/stage_c_tables/mathscholar-stage-c-tables.ipynb",
    "KAGGLE/step29_test_eval/mathscholar-step29-test-eval.ipynb",
    "KAGGLE/step30_full_ocr_reindex/mathscholar-step30-full-ocr-reindex.ipynb",
]
[tool.ruff.lint]
select = ["E","F","I","N","B","UP"]
# These three fire only on course-provided stub patterns we are told not to restructure:
#   F405 - the stubs use `from ..contracts import *  # noqa`, so every Page/Region/Chunk
#          reference is flagged. The `# noqa` on the import shows this was intended.
#   E501 - black (line-length 100) is our formatter; leaving E501 on double-reports the
#          long comment lines black deliberately cannot split.
#   N812 - `import lightning as L` is Lightning's own documented convention.
ignore = ["F405", "E501", "N812"]
[tool.black]
line-length = 100
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-q"
testpaths = ["tests"]
